name: Compatibility checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: sh -n install.sh
      - name: PHP syntax
        run: |
          find plugin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Fork compatibility assertions
        run: python3 tests/static_compat_test.py
      - name: Behavioral stop regressions
        run: python3 tests/behavioral_stop_test.py
      - name: Behavioral Apply and restart regressions
        run: python3 tests/behavioral_actions_test.py
      - name: Behavioral global lock inheritance
        run: python3 tests/behavioral_lock_test.py
